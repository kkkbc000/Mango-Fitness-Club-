<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Mango Fitness Club</title>
<style>
:root{--ink:#4a3a23;--sub:#927a53;--orange:#e99c36;--cream:#fff7d8;--yellow:#ffe9a5;--green:#6c9a67}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#fff1b9 0%,#fff8df 45%,#fffdf5 100%);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}main{max-width:580px;margin:auto;padding:18px 16px 56px}.hero{position:relative;overflow:hidden;border-radius:27px;padding:30px 22px 36px;background:linear-gradient(135deg,#ffe39a,#ffedbb 58%,#fff2ca);box-shadow:0 8px 24px #c9942c18;isolation:isolate}.eyebrow{font-size:11px;font-weight:850;letter-spacing:1.8px;color:#a47a31}.hero h1{font-size:27px;line-height:1.3;margin:18px 0 9px;position:relative;z-index:1;letter-spacing:-.8px}.hero p{font-size:13px;line-height:1.7;margin:0;position:relative;z-index:1;color:#795f32;max-width:270px}.mango{position:absolute;font-size:70px;opacity:.16;user-select:none;pointer-events:none;animation:float 7s ease-in-out infinite}.m1{right:4px;top:12px;transform:rotate(-18deg)}.m2{right:45px;bottom:-30px;font-size:105px;animation-delay:-3s}.m3{right:108px;top:-36px;font-size:62px;animation-delay:-1.5s}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -11px}}@media(prefers-reduced-motion:reduce){.mango{animation:none}}.toolbar{display:flex;gap:9px;margin:20px 0 14px}select,.refresh{font:inherit;border-radius:14px;padding:12px;border:1px solid #eeddb7;background:#fff;color:var(--ink)}select{flex:1;font-weight:700;min-width:0}.refresh{font-weight:700;color:#a76a1f;background:#fff8e9;cursor:pointer}.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px}.stat,.panel{background:#fffefa;border:1px solid #f3e9cf;border-radius:20px;box-shadow:0 4px 14px #b7923810}.stat{padding:17px}.stat span{font-size:12px;color:var(--sub)}.stat strong{display:block;font-size:27px;margin-top:3px}h2{font-size:18px;margin:25px 0 12px}.hint{font-size:12px;color:var(--sub);margin:-5px 0 12px}.top{display:flex;flex-direction:column;gap:9px}.member{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fffefa;border:1px solid #f0e4c7;border-radius:16px;padding:15px;color:inherit;cursor:pointer;font:inherit}.member.first{background:#fff2c9;border-color:#f1d88b}.medal{font-size:25px;min-width:35px;text-align:center}.member .name{font-size:14px;font-weight:750;overflow-wrap:anywhere}.member .ranknote{font-size:11px;color:var(--sub)}.count{margin-left:auto;font-weight:850;color:#b97722;white-space:nowrap}.ranking{overflow:hidden}.ranking .member{border:0;border-bottom:1px solid #f5ebd9;border-radius:0}.ranking .member:last-child{border-bottom:0}.ranknum{min-width:35px;text-align:center;font-weight:800;color:#bd8a38}.chev{color:#c5ad83}.foot{text-align:center;font-size:11px;color:#a48d67;margin:22px 0}.overlay{display:none;position:fixed;inset:0;background:#30261983;z-index:20;justify-content:center;align-items:flex-end}.overlay.open{display:flex}.modal{background:#fffefa;border-radius:25px 25px 0 0;width:100%;max-width:580px;max-height:88vh;overflow:auto;padding:23px 20px 35px}.modalhead{display:flex;justify-content:space-between;gap:12px}.modalhead h2{margin:5px 0 2px}.close{background:#fff1cf;border:0;border-radius:50%;height:36px;width:36px;font-size:22px;cursor:pointer}.detailstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.detailstat{border-radius:17px;padding:15px;text-align:center;background:#fff1c8}.detailstat:nth-child(2){background:#eaf5df}.detailstat small{display:block;color:#7d7157}.detailstat strong{font-size:24px}.week{display:grid;grid-template-columns:54px 1fr 32px;gap:10px;align-items:center;margin:12px 0;font-size:12px}.track{height:12px;border-radius:15px;background:#f3eedf;overflow:hidden}.bar{height:100%;background:#9cc98d;border-radius:15px}.dates{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:8px 11px;background:#fff1cf;color:#9a6a26;border-radius:10px;font-size:12px;font-weight:700}.empty{font-size:13px;color:var(--sub)}@media(min-width:600px){.overlay{align-items:center}.modal{border-radius:25px;margin:16px}}
</style>
</head>
<body><main>
<header class="hero"><div class="eyebrow">MANGO FITNESS CLUB</div><h1>갓생을 위한 첫걸음</h1><p>오늘 쌓은 꾸준함이 내일의 변화를 만듭니다</p><span class="mango m1">🥭</span><span class="mango m2">🥭</span><span class="mango m3">🥭</span></header>
<div class="toolbar"><select id="month" aria-label="월 선택"><option value="2026년 10월">2026년 10월</option><option value="2026년 11월">2026년 11월 (예시)</option></select><button class="refresh" id="refresh">↻ 새로고침</button></div>
<section class="stats"><div class="stat"><span>참여 회원</span><strong id="people">0명</strong></div><div class="stat"><span>이달의 운동 합계</span><strong id="total">0회</strong></div></section>
<h2>🏆 이달의 TOP 3</h2><p class="hint">이름을 누르면 개인 기록을 볼 수 있어요.</p><div class="top" id="top"></div>
<h2>✨ 전체 운동 랭킹</h2><div class="panel ranking" id="ranking"></div><p class="foot" id="foot">예시 데이터로 만든 디자인 미리보기 · 실제 출석부 미연동</p>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="회원별 운동 기록"><div class="modal"><div class="modalhead"><div><div class="eyebrow">MY WORKOUT RECORD</div><h2 id="detailname"></h2><div class="hint" id="detailmonth"></div></div><button class="close" id="close" aria-label="닫기">×</button></div><div class="detailstats"><div class="detailstat"><small>이번 달 운동</small><strong id="detailcount"></strong></div><div class="detailstat"><small>현재 순위</small><strong id="detailrank"></strong></div></div><h2>📊 주차별 운동 횟수</h2><div id="weeks"></div><h2>📅 운동한 날짜</h2><div class="dates" id="dates"></div></div></div>
<script>
// 예시 데이터만 사용합니다. 구글 시트나 회원 개인정보는 연결되지 않았습니다.
const example={
 '2026년 10월':[
  {name:'망고',weeks:[3,4,5,4],dates:['10/1','10/2','10/5','10/6','10/7','10/8','10/9','10/12','10/13','10/14','10/15','10/16','10/19','10/20','10/21','10/22']},
  {name:'써니',weeks:[4,4,3,3],dates:['10/1','10/2','10/5','10/6','10/7','10/8','10/12','10/13','10/14','10/15','10/19','10/20','10/21','10/22']},
  {name:'파랑',weeks:[3,3,3,3],dates:['10/1','10/2','10/5','10/6','10/7','10/12','10/13','10/14','10/19','10/20','10/21','10/22']},
  {name:'초록',weeks:[2,3,3,2],dates:['10/1','10/5','10/6','10/7','10/12','10/13','10/14','10/19','10/20','10/21']},
  {name:'레몬',weeks:[2,2,2,2],dates:['10/1','10/2','10/5','10/6','10/12','10/13','10/19','10/20']}
 ],
 '2026년 11월':[
  {name:'초록',weeks:[2,3,4,3],dates:['11/2','11/3','11/9','11/10','11/11','11/16','11/17','11/18','11/19','11/23','11/24','11/25']},
  {name:'망고',weeks:[3,3,2,3],dates:['11/2','11/3','11/4','11/9','11/10','11/11','11/16','11/17','11/23','11/24','11/25']},
  {name:'써니',weeks:[2,2,3,2],dates:['11/2','11/3','11/9','11/10','11/16','11/17','11/18','11/23','11/24']}
 ]
};
const $=id=>document.getElementById(id);
const node=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
let members=[];
function render(){const month=$('month').value;members=example[month].map(m=>({...m,count:m.weeks.reduce((a,b)=>a+b,0)})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'ko'));let last=-1,rank=0;members.forEach((m,i)=>{if(m.count!==last)rank=i+1;m.rank=rank;last=m.count});$('people').textContent=members.length+'명';$('total').textContent=members.reduce((a,m)=>a+m.count,0)+'회';$('top').replaceChildren();$('ranking').replaceChildren();members.filter(m=>m.rank<=3).forEach(m=>$('top').appendChild(memberButton(m,true)));members.forEach(m=>$('ranking').appendChild(memberButton(m,false)))}
function memberButton(m,top){const b=node('button','member'+(top&&m.rank===1?' first':''));b.type='button';b.appendChild(node('span',top?'medal':'ranknum',top?({1:'🥇',2:'🥈',3:'🥉'}[m.rank]||'🏅'):m.rank+'위'));const info=node('div');info.appendChild(node('div','name',m.name));if(top)info.appendChild(node('div','ranknote',m.rank+'위'));b.appendChild(info);b.appendChild(node('span','count',m.count+'회'));if(!top)b.appendChild(node('span','chev','›'));b.addEventListener('click',()=>show(m));return b}
function show(m){$('detailname').textContent=m.name+'님의 기록';$('detailmonth').textContent=$('month').value;$('detailcount').textContent=m.count+'회';$('detailrank').textContent=m.rank+'위';$('weeks').replaceChildren();const max=Math.max(1,...m.weeks);m.weeks.forEach((n,i)=>{const row=node('div','week');row.appendChild(node('span','',(17+i)+'주차'));const track=node('div','track');const bar=node('div','bar');bar.style.width=n/max*100+'%';track.appendChild(bar);row.appendChild(track);row.appendChild(node('strong','',n+'회'));$('weeks').appendChild(row)});$('dates').replaceChildren();m.dates.forEach(d=>$('dates').appendChild(node('span','pill',d+' · 1회')));$('overlay').classList.add('open');document.body.style.overflow='hidden'}
function close(){ $('overlay').classList.remove('open');document.body.style.overflow=''}
$('month').addEventListener('change',render);$('refresh').addEventListener('click',render);$('close').addEventListener('click',close);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></body></html>
